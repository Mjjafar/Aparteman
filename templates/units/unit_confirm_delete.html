{% extends "base.html" %}
{% block title %}حذف {{ unit }}{% endblock %}
{% block content %}
<h1>حذف {{ unit }}</h1>
<p>آیا از حذف «{{ unit }} — مالک: {{ unit.owner_name }}» مطمئن هستید؟ این عمل قابل بازگشت نیست.</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">بله، حذف کن</button>
<a class="btn btn-secondary" href="{% url 'units:list' %}">انصراف</a></form>
{% endblock %}
