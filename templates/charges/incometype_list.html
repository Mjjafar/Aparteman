{% extends "base.html" %}
{% block title %}انواع درآمد{% endblock %}
{% block content %}
<h1>تعریف انواع درآمد</h1>
<p><a class="btn btn-primary" href="{% url 'charges:income-type-create' %}">➕ نوع درآمد جدید</a></p>
<table class="fund-table">
<thead><tr><th>عنوان</th><th>شارژ ماهیانه؟</th><th>عملیات</th></tr></thead>
<tbody>
{% for t in types %}
<tr><td>{{ t.title }}</td><td>{% if t.is_charge %}بله{% else %}خیر{% endif %}</td>
<td><a class="text-danger" href="{% url 'charges:income-type-delete' t.pk %}">حذف</a></td></tr>
{% empty %}<tr><td colspan="3">موردی ثبت نشده است.</td></tr>{% endfor %}
</tbody>
</table>
{% endblock %}
