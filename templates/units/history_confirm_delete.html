{% extends "base.html" %}
{% block title %}حذف سابقه {{ kind }}{% endblock %}
{% block content %}
<h1>حذف سابقه {{ kind }}</h1>
<p>آیا از حذف «{{ rec.name }} ({{ rec.phone }})» مطمئن هستید؟ این عمل قابل بازگشت نیست.</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">بله، حذف کن</button>
<a class="btn btn-secondary" href="{% url 'units:detail' rec.unit_id %}">انصراف</a></form>
{% endblock %}
